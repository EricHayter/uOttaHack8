version: '3.8'

services:
  solace-agent-mesh:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    command: run
    ports:
      - "8000:8000"   # FastAPI HTTP
      - "8443:8443"   # FastAPI HTTPS
      - "8001:8001"   # Platform API
      - "5002:5002"   # Web UI (for init/config)
      - "8080:8080"   # REST API
    volumes:
      - ./:/app
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped
